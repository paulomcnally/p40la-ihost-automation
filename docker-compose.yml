services:
  p40la-ihost-automation:
    build:
      context: .
      secrets:
        - gh_token
    image: paulomcnally/p40la-ihost-automation:latest
    container_name: p40la-ihost-automation
    restart: unless-stopped
    ports:
      - "8089:8089"
    volumes:
      - p40la-ihost-automation-data:/app/data
    environment:
      - PORT=8089
      - DATA_DIR=/app/data
      - LOG_LEVEL=info
      - VERSION=0.1.7

volumes:
  p40la-ihost-automation-data:

# Token con lectura del repo privado de plugins (SPEC-015). Creá el archivo
# .gh_token con:  gh auth token > .gh_token
secrets:
  gh_token:
    file: .gh_token